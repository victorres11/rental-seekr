app = "rental-seeker-richmond"
primary_region = "iad"

[build]

[env]
  APP_HOST = "0.0.0.0"
  APP_PORT = "8765"
  DB_FILE = "/data/rental_search.db"
  PORT = "8765"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "rental_data"
  destination = "/data"
